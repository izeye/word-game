# Bound to loopback: the app serves word files read from the local filesystem.
server.address=127.0.0.1
server.port=8080

# Libraries are scanned recursively for .csv (comma) and .vsv (vertical bar) files.
# Relative paths resolve against the working directory, as they do for the CLI.
wordgame.libraries[0].name=Samples
wordgame.libraries[0].path=src/main/resources/words
wordgame.libraries[1].name=Books
wordgame.libraries[1].path=../word-game-data/data/books
